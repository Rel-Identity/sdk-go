      - Jobs
  /client/jobs/{job_id}/results.txt:
    get:
      description: Return the canonical background job results in a readable plain-text
        format.
      operationId: getJobResultsText
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
        style: simple
      - explode: false
        in: header
        name: if-none-match
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      - explode: false
        in: header
        name: if-modified-since
        required: false
        schema:
          nullable: true
