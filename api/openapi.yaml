  /client/jobs/finder:
    post:
      description: Queue a background finder batch job with an optional deadline and
        callback URL.
      operationId: scheduleFinderBatch
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinderBatchJobRequest"
        required: true
      responses:
        "202":
          content:
