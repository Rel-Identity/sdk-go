openapi: 3.0.3
info:
  description: "Public client API for Finder and Probe workflows. This spec is generated\
    \ from the FastAPI app, then narrowed to the supported bearer-authenticated routes\
    \ used by SDKs and the API reference."
  title: Relentless Identity API
  version: 1.0.0
servers:
- description: Production
  url: https://api.relentlessidentity.com
security:
- bearerAuth: []
tags:
- description: "Inspect token status, usage balance, request history, and job history."
  name: Account
- description: Resolve the most likely work email for a person at a known domain.
  name: Finder
- description: Verify one or many known email addresses.
  name: Probe
- description: "Queue asynchronous Finder and Probe Batch work, then inspect job status\
    \ and results."
  name: Jobs
paths:
  /client/token:
    get:
      description: Validate the current bearer token and return its active claims.
      operationId: getTokenStatus
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTokenStatusResponse"
          description: Bearer token status
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid bearer token
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient usage balance for that request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The bearer token does not include the required scope
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected backend failure
      security:
      - bearerAuth: []
      summary: Inspect the current bearer token
      tags:
      - Account
  /client/usage:
    get:
      description: "Return the current account usage, free-tier limits, and paid capacity\
        \ details for the authenticated user."
      operationId: getUsage
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUsageResponse"
          description: Usage summary
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid bearer token
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient usage balance for that request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The bearer token does not include the required scope
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected backend failure
      security:
      - bearerAuth: []
      summary: Get current usage and limits
      tags:
      - Account
  /client/history:
    get:
      description: Return the authenticated user's latest request history with pagination
        and optional filters.
      operationId: getRequestHistory
      parameters:
      - description: Page number starting at 1.
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          description: Page number starting at 1.
          minimum: 1
          title: Page
          type: integer
        style: form
      - description: Number of history rows per page. Maximum 25.
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          description: Number of history rows per page. Maximum 25.
          maximum: 25
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - description: Optional request-type filter.
        explode: true
        in: query
        name: request_type
        required: false
        schema:
          enum:
          - finder
          - probe
          nullable: true
          type: string
        style: form
      - description: Optional deliverability-state filter.
        explode: true
        in: query
        name: state
        required: false
        schema:
          enum:
          - deliverable
          - undeliverable
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRequestHistoryPageResponse"
          description: Paginated request history
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid bearer token
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient usage balance for that request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The bearer token does not include the required scope
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected backend failure
      security:
      - bearerAuth: []
      summary: Get paginated request history
      tags:
      - Account
  /client/jobs:
    get:
      description: Return the authenticated user's paginated background job history.
      operationId: listJobs
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        style: form
      - explode: true
        in: query
        name: job_type
        required: false
        schema:
          enum:
          - finder_batch
          - probe_batch
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - queued
          - processing
          - completed
          - failed
          - canceled
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBackgroundJobPageResponse"
          description: Paginated background jobs
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid bearer token
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient usage balance for that request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The bearer token does not include the required scope
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected backend failure
      security:
      - bearerAuth: []
      summary: List background jobs
      tags:
      - Jobs
  /client/jobs/{job_id}:
    get:
      description: Return the current status and paginated results for one background
        job.
      operationId: getJob
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBackgroundJobDetailResponse"
          description: Background job detail
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid bearer token
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient usage balance for that request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The bearer token does not include the required scope
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected backend failure
      security:
      - bearerAuth: []
      summary: Get background job
      tags:
      - Jobs
  /client/jobs/{job_id}/inputs.txt:
    get:
      description: Return the original background job inputs as plain text when the
        payload is still retained.
      operationId: getJobInputsText
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
        style: simple
      - explode: false
        in: header
        name: if-none-match
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      - explode: false
        in: header
        name: if-modified-since
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Background job inputs
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid bearer token
        "402":
          content:
            application/json:
