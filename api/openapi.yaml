components:
  schemas:
    AliasInfo:
      description: Alias information when email is resolved to a different address.
      example:
        original: original
        resolved: resolved
      properties:
        original:
          nullable: true
          type: string
        resolved:
          nullable: true
          type: string
      title: AliasInfo
      type: object
    BatchSummary:
      additionalProperties: false
      example:
        unique_domains: 0
        total: 0
        found: 0
        not_found: 0
        errors: 0
      properties:
        total:
          description: Total number of requested items.
          minimum: 0
          type: integer
        found:
          description: Items that resolved to a positive deliverable result.
          minimum: 0
          type: integer
        not_found:
          description: Items that completed cleanly with a negative result.
          minimum: 0
          type: integer
        errors:
          description: Items that ended with an operational verification error rather
            than a mailbox verdict.
          minimum: 0
          type: integer
        unique_domains:
          description: Distinct mailbox domains represented in the batch.
          minimum: 0
          type: integer
      required:
      - errors
      - found
      - not_found
      - total
      - unique_domains
      type: object
    ClientBackgroundJobDetailResponse:
      description: Background job detail plus paginated item results.
      example:
        results_expired: true
        page: 5
        total_pages: 2
        job:
          job_type: finder_batch
          artifact_available: false
          artifact_json_url: artifact_json_url
          metadata:
            key: ""
          deadline_at: 2000-01-23T04:56:07.000+00:00
          artifact_size_bytes: 4
          not_found_count: 2
          created_at: 2000-01-23T04:56:07.000+00:00
          results_pruned_at: 2000-01-23T04:56:07.000+00:00
          error_count: 7
          scheduled_start_at: 2000-01-23T04:56:07.000+00:00
          callback_url: callback_url
          artifact_uploaded_at: 2000-01-23T04:56:07.000+00:00
          updated_at: 2000-01-23T04:56:07.000+00:00
          id: id
          completed_count: 5
          summary:
            key: ""
          reserved_amount_micros: 9
          progress_percent: 2.027123
          history_expires_at: 2000-01-23T04:56:07.000+00:00
          callback_status: none
          estimated_runtime_seconds: 0
          success_count: 5
          callback_last_error: callback_last_error
          completed_at: 2000-01-23T04:56:07.000+00:00
