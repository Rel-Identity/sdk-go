  /client/probe/batch:
    post:
      description: Send many known email addresses and receive compact per-item identity
        results plus a batch summary.
      operationId: probeBatch
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeBatchRequest"
