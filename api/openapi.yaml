  /client/attempt:
    post:
      description: Send a full name and company domain to resolve the most likely
        verified work email.
      operationId: finderAttempt
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
