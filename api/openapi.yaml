          description: Request rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected backend failure
      security:
      - bearerAuth: []
      summary: Schedule a finder batch
      tags:
      - Jobs
  /client/jobs/probe-batch:
    post:
      description: Queue a background probe batch job with an optional deadline and
        callback URL.
      operationId: scheduleProbeBatch
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeBatchJobBackgroundRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBackgroundJobResponse"
          description: Successful Response
        "422":
          content:
